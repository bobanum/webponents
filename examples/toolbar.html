<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<script type="module" src="../src/Toolbar.js"></script>
	<title>Toolbar Example</title>
</head>
<body>
	<toolbar-ponent>
		<toolbar-item-ponent style="margin-right: auto;" label="Accueil" icon="home"></toolbar-item-ponent>
		<toolbar-item-ponent label="Sauvegarder la grille" icon="save"></toolbar-item-ponent>
		<toolbar-item-ponent label="Imprimer la grille" icon="print"></toolbar-item-ponent>
		<toolbar-item-ponent label="Dupliquer la grille" icon="content_copy"></toolbar-item-ponent>
		<toolbar-item-ponent label="Récupérer une archive" icon="unarchive">
			<toolbar-ponent style="flex-direction: column;">
				<toolbar-item-ponent label="Courant">ici</toolbar-item-ponent>
				<toolbar-item-ponent label="2022-10-24 15:24:44"></toolbar-item-ponent>
				<toolbar-item-ponent label="2022-10-24 15:21:00"></toolbar-item-ponent>
			</toolbar-ponent>
		</toolbar-item-ponent>
		<toolbar-item-ponent label="Annuler les modifications" icon="restore_page"></toolbar-item-ponent>
		<toolbar-item-ponent label="Supprimer la grille" icon="delete"></toolbar-item-ponent>
	</toolbar-ponent>
